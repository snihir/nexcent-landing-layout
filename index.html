<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="normalize.css">
    <link rel="stylesheet" href="main.css">

    <link rel="icon" type="image/svg" href="images/favicon.svg">
    <title>Nexcent</title>
</head>
<body>


    <header>
    <div class="container header__container">
        <a href="#" class="header__logo">
                <img src="images/logo.svg" alt="Nexcent Logo">
                <span>Nexcent</span>
        </a>
        <nav>
            <ul class="nav__list">
                <li><a class="nav__link" href="#">Features</a></li>
                <li><a class="nav__link" href="#">Community</a></li>
                <li><a class="nav__link" href="#">Home</a></li>
                <li><a class="nav__link" href="#">Blog</a></li>
                <li><a class="nav__link" href="#">Pricing</a></li>
                <li><a class="btn" href="#">Register Now</a></li>
            </ul>
        </nav>
    </div>
    </header>


    <section class="hero">
        <div class="container hero__container">
            <div class="hero__content">
                <h1>
                    Lessons and insights <span>from 8 years</span>
                </h1>
                <p>
                    Where to grow your business as a photographer: site or social media?
                </p>
                <a class ="btn" href="#">Register</a>
            </div>

            <img src="images/Illustration.svg" alt="" class="hero__img">
        </div>
    </section>

    <section>
        <div class="container clients__container">
            <h2>Our Clients</h2>
            <p>We have been working with some Fortune 500+ clients</p>
            <ul class="clients__list">
                <li><img src="images/clients/1.svg" alt="Client 1"></li>
                <li><img src="images/clients/2.svg" alt="Client 2"></li>
                <li><img src="images/clients/3.svg" alt="Client 3"></li>
                <li><img src="images/clients/4.svg" alt="Client 4"></li>
                <li><img src="images/clients/5.svg" alt="Client 5"></li>
                <li><img src="images/clients/6.svg" alt="Client 6"></li>
                <li><img src="images/clients/7.svg" alt="Client 7"></li>
            </ul>
        </div>
    </section>
</body>
</html>
